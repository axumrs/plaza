syntax = "proto3";

package invoice;

import "google/protobuf/timestamp.proto";

// 账单状态枚举
enum InvoiceStatus {
    Unpaid = 0;      // 待支付
    Paid = 1;        // 已支付
    Overdue = 2;     // 已逾期
    Cancelled = 3;   // 已取消
    Refunded = 4;    // 已退款
}

// 账单类型枚举
enum InvoiceKind {
    OrderPayment = 0;    // 订单支付
    OrderRefund = 1;     // 订单退款
    Withdrawal = 2;      // 提现
    Recharge = 3;        // 充值
    Commission = 4;      // 佣金/分成
    PlatformService = 5; // 平台服务费
}

// 账单消息
message Invoice {
    // 账单唯一 ID (CHAR(20))
    string id = 1;

    // 关联的业务 ID (通常是订单 ID)
    string order_id = 2;

    // 买家 ID
    string user_id = 3;

    // 卖家店铺 ID
    string shop_id = 4;

    // 应付金额 (单位：分)
    int64 amount = 5;

    // 实付金额 (单位：分)
    int64 pay_amount = 6;

    // 状态
    InvoiceStatus status = 7;

    // 类型
    InvoiceKind kind = 8;

    // 支付交易号
    string pay_tx_id = 9;

    // 备注
    string remark = 10;

    // 截止支付日期
    google.protobuf.Timestamp due_date = 11;

    // 支付时间
    google.protobuf.Timestamp paid_at = 12;

    // 创建时间
    google.protobuf.Timestamp created_at = 13;

    // 更新时间
    google.protobuf.Timestamp updated_at = 14;
}